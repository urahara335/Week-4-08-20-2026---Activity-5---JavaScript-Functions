<!DOCTYPE html>
<html>
<head>
    <title>Simple Computation Menu</title>
</head>

<body>

    <h2>Simple Computation Menu</h2>

    <label>Enter first number:</label>
    <input type="number" id="num1"><br><br>

    <label>Enter second number:</label>
    <input type="number" id="num2"><br><br>

    <button onclick="add()">Addition</button>
    <button onclick="subtract()">Subtraction</button>
    <button onclick="multiply()">Multiplication</button>
    <button onclick="modulo()">Modulo</button>

    <h3>Result: <span id="sagot"></span></h3>

    <script>
        function add() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            document.getElementById("sagot").innerHTML = a + b;
        }

        function subtract() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            document.getElementById("sagot").innerHTML = a - b;
        }

        function multiply() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            document.getElementById("sagot").innerHTML = a * b;
        }

        function modulo() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);

            if (b != 0) {
                document.getElementById("sagot").innerHTML = a % b;
            } else {
                document.getElementById("sagot").innerHTML = "Cannot modulo by 0";
            }
        }
    </script>

</body>
</html>
